name: Mutation

# Stryker mutates the code and reruns the unit tests: a mutant that survives is a bug
# the tests would miss. Full runs (no incremental mode: it kept stale results), about
# 3 minutes per package in parallel. Each package fails below its own `break` threshold.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dir: apps/api }
          - { name: mcp, dir: apps/mcp }
          - { name: web, dir: apps/web }
          - { name: api-client, dir: packages/api-client }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation testing
        run: pnpm --filter @mindbridge/${{ matrix.name }} test:mutation
      - name: Score in the job summary
        if: ${{ !cancelled() && hashFiles(format('{0}/reports/mutation/mutation.json', matrix.dir)) != '' }}
        run: node .github/scripts/mutation-summary.mjs "${{ matrix.dir }}/reports/mutation/mutation.json" "${{ matrix.name }}"
      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.name }}
          path: ${{ matrix.dir }}/reports/mutation/
          retention-days: 14
