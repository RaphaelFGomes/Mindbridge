name: Security

# Findings go to the repository's Security tab (code scanning, SARIF). Nothing here
# opens issues or comments on pull requests.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: new rules and advisories also hit unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
          # Dependabot PRs get a read-only token: analyse, but don't upload.
          upload: ${{ github.actor == 'dependabot[bot]' && 'never' || 'always' }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs as the runner's user (reports aren't root-owned); that user has no home
      # in the image, and Semgrep needs one for its settings and logs. Findings are
      # printed in the log and written as SARIF for the Security tab.
      - name: Scan
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src
          semgrep/semgrep:1.187.0
          semgrep scan --metrics off --error
          --config p/default --config p/typescript --config p/nodejs --config p/react
          --sarif-output semgrep.sarif
      - name: Upload findings
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan every commit
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact
          --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Upload findings
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trivy:
    name: Dependencies & config (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the lockfile and config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif
          exit-code: '1'
      - name: Upload findings
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy

  # Dynamic analysis: attacks the running web UI and API. ZAP reports URLs, not code
  # lines (no SARIF), so findings go to the job summary plus an HTML artifact.
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mindbridge
          POSTGRES_PASSWORD: mindbridge
          POSTGRES_DB: mindbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindbridge -d mindbridge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://mindbridge:mindbridge@localhost:5432/mindbridge
      NEXT_TELEMETRY_DISABLED: '1'
      # Official image; `stable` on purpose: new rules showing new findings is the point.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the API and the web app
        run: pnpm turbo run build --filter=@mindbridge/api --filter=@mindbridge/web
      - run: pnpm db:migrate
      - name: Create an API key for the scan
        working-directory: apps/api
        run: |
          key="$(node --import tsx src/scripts/keys.ts create --name ci-zap --quiet)"
          echo "::add-mask::$key"
          echo "ZAP_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Start the API and the web app (production mode)
        run: |
          (cd apps/api && HOST=127.0.0.1 PORT=4011 NODE_ENV=production LOG_LEVEL=warn nohup node dist/server.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd apps/web && WEB_PORT=3011 MINDBRIDGE_API_URL=http://127.0.0.1:4011 MINDBRIDGE_API_KEY= nohup pnpm start > "$RUNNER_TEMP/web.log" 2>&1 &)
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:4011/health
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:3011/login
      - name: Prepare the ZAP work folder
        run: mkdir -p zap && cp .zap/*.tsv zap/ && chmod -R a+rwX zap
      # The session cookie holds the API key, so the spider sees the signed-in pages.
      - name: ZAP baseline, web UI (signed in)
        run: >-
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE"
          zap-baseline.py -t http://127.0.0.1:3011/memories -c web-rules.tsv
          -r zap-web.html -w zap-web.md
          -z "-config replacer.full_list(0).description=session
          -config replacer.full_list(0).enabled=true
          -config replacer.full_list(0).matchtype=REQ_HEADER
          -config replacer.full_list(0).matchstr=Cookie
          -config replacer.full_list(0).regex=false
          -config replacer.full_list(0).replacement=mindbridge_session=$ZAP_API_KEY"
      # Active scan of every documented operation (injection, XSS, path traversal...).
      - name: ZAP API scan, REST API (from the OpenAPI document)
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE"
          zap-api-scan.py -t http://127.0.0.1:4011/openapi.json -f openapi -c api-rules.tsv
          -r zap-api.html -w zap-api.md
          -z "-config replacer.full_list(0).description=auth
          -config replacer.full_list(0).enabled=true
          -config replacer.full_list(0).matchtype=REQ_HEADER
          -config replacer.full_list(0).matchstr=Authorization
          -config replacer.full_list(0).regex=false
          -config replacer.full_list(0).replacement=Bearer $ZAP_API_KEY"
      - name: Findings in the job summary
        if: ${{ !cancelled() }}
        run: |
          for report in zap/zap-web.md zap/zap-api.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      # Reports may contain the run's throwaway API key (ephemeral database).
      - name: Upload ZAP reports and server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: |
            zap/*.html
            zap/*.md
            ${{ runner.temp }}/*.log
          retention-days: 14
