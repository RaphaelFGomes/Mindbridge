name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Generated files are up to date (migrations, OpenAPI, API client types)
        run: |
          pnpm --filter @mindbridge/api db:generate
          pnpm --filter @mindbridge/api openapi:export
          pnpm --filter @mindbridge/api-client generate
          git add --intent-to-add apps/api/drizzle apps/api/openapi.json packages/api-client/src/generated
          git diff --exit-code -- apps/api/drizzle apps/api/openapi.json packages/api-client/src/generated

  integration:
    name: Integration tests + coverage (Testcontainers + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC upload to Codecov: no long-lived token stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit + integration in one run, so coverage and its thresholds see both.
      - run: pnpm test:coverage
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: apps/api/coverage/lcov.info,apps/mcp/coverage/lcov.info,apps/web/coverage/lcov.info,packages/api-client/coverage/lcov.info
          disable_search: true
          # Reporting must never break PR builds (e.g. Dependabot); a failed upload on main should.
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  api:
    name: API tests (Playwright + Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mindbridge
          POSTGRES_PASSWORD: mindbridge
          POSTGRES_DB: mindbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindbridge -d mindbridge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://mindbridge:mindbridge@localhost:5432/mindbridge
      API_URL: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mindbridge/api build
      - run: pnpm db:migrate
      - name: Create an API key for this run
        working-directory: apps/api
        run: |
          key="$(node --import tsx src/scripts/keys.ts create --name ci-api-tests --quiet)"
          echo "::add-mask::$key"
          echo "MINDBRIDGE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Start the API
        env:
          HOST: 127.0.0.1
          PORT: '4010'
          NODE_ENV: test
          LOG_LEVEL: info
        run: |
          nohup node apps/api/dist/server.js > api.log 2>&1 &
          curl --silent --show-error --fail --retry 30 --retry-connrefused --retry-delay 1 "$API_URL/health"
      - name: Playwright API tests (black-box, contract-checked)
        run: pnpm test:api
      - name: Schemathesis (OpenAPI-driven fuzzing)
        if: ${{ !cancelled() }}
        run: >-
          pipx run --spec schemathesis==4.34.0 schemathesis run "$API_URL/openapi.json"
          --header "Authorization: Bearer $MINDBRIDGE_API_KEY"
          --checks all
          --max-examples 50
          --report junit,html
          --report-dir reports/schemathesis
      - name: Upload API test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-reports
          path: |
            tests/api/reports/
            reports/schemathesis/
            api.log
          retention-days: 14

  e2e:
    name: E2E, accessibility & visual (Playwright + axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mindbridge
          POSTGRES_PASSWORD: mindbridge
          POSTGRES_DB: mindbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindbridge -d mindbridge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://mindbridge:mindbridge@localhost:5432/mindbridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @mindbridge/e2e exec playwright install --with-deps chromium
      # Builds the API and the web app, starts both on dedicated ports, signs in through the UI.
      - run: pnpm test:e2e
      # Same container image as local runs, so screenshots match the committed baselines.
      - name: Start the visual-testing browser (official Playwright container)
        if: ${{ !cancelled() }}
        run: pnpm visual:browser
      - name: Visual snapshots
        if: ${{ !cancelled() }}
        run: pnpm test:visual
      - name: Upload E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            tests/e2e/reports/
            tests/e2e/test-results/
          retention-days: 14
