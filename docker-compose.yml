# Local development database. Integration tests do NOT use this:
# they start their own throwaway container via Testcontainers.
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: mindbridge
      POSTGRES_PASSWORD: mindbridge
      POSTGRES_DB: mindbridge
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindbridge -d mindbridge']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
