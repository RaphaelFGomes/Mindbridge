# Codecov is reporting only (badge + history). The coverage gate lives in
# apps/api/vitest.config.ts (thresholds), so CI fails locally and in Actions alike.
comment: false # never comment on pull requests

github_checks:
  annotations: false # no line annotations on PR diffs

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# lcov files carry repo-relative paths (projectRoot in each vitest.config.ts).

# One upload, split per package in the Codecov UI.
component_management:
  individual_components:
    - component_id: api
      name: API
      paths: ['apps/api/**']
    - component_id: mcp
      name: MCP server
      paths: ['apps/mcp/**']
    - component_id: web
      name: Web UI
      paths: ['apps/web/**']
    - component_id: api-client
      name: API client
      paths: ['packages/api-client/**']
