# Codecov is reporting only (badge + history). The coverage gate lives in
# apps/api/vitest.config.ts (thresholds), so CI fails locally and in Actions alike.
comment: false # never comment on pull requests

github_checks:
  annotations: false # no line annotations on PR diffs

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# lcov files carry repo-relative paths (projectRoot in each vitest.config.ts).
